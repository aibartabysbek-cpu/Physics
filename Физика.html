<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЭМ-волны и опыты Герца — Интерактивный учебник</title>

<!-- KaTeX CDN для физических формул -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

<style>
:root {
  --bg: #070b19;
  --panel-bg: rgba(18, 25, 48, 0.72);
  --panel-border: rgba(99, 130, 220, 0.25);
  --panel-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
  --pn: #121930;
  --ln: rgba(99, 130, 220, 0.42);
  --tx: #f0f4ff;
  --mu: #9bb0e5;
  --E: #4aa8ff;
  --B: #ff4fd8;
  --C: #ffd23f;
  --ok: #38bdf8;
  --bad: #ff6b6b;
  --accent: #3b82f6;
  --radius: 16px;
  box-sizing: border-box;
}

:root[data-theme=light] {
  --bg: #edf2f9;
  --panel-bg: rgba(255, 255, 255, 0.78);
  --panel-border: rgba(160, 180, 220, 0.45);
  --panel-shadow: 0 16px 36px rgba(10, 25, 60, 0.12);
  --pn: #ffffff;
  --ln: rgba(120, 145, 200, 0.55);
  --tx: #0f172a;
  --mu: #475569;
  --E: #0284c7;
  --B: #d946ef;
  --C: #d97706;
  --ok: #0284c7;
  --bad: #dc2626;
  --accent: #2563eb;
}

* { box-sizing: border-box; user-select: none; }
html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); font: 15px/1.4 system-ui, -apple-system, sans-serif; color: var(--tx); }

/* ФОНОВЫЙ КАНВАС НА ВЕСЬ ЭКРАН */
#cv { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; touch-action: none; cursor: grab; }
#cv:active { cursor: grabbing; }

/* ИНТЕРФЕЙСНЫЙ СЛОЙ */
.ui-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  opacity: 1;
}

.ui-layer > * {
  pointer-events: auto;
}

/* СТЕКЛЯННЫЕ ПАНЕЛИ (GLASSMORPHISM) */
.glass {
  background: var(--panel-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--panel-border);
  box-shadow: var(--panel-shadow);
  border-radius: var(--radius);
  color: var(--tx);
  transition: border-color 0.2s, box-shadow 0.2s, opacity 0.25s, transform 0.25s;
}

/* ВЕРХНЯЯ ПАНЕЛЬ УПРАВЛЕНИЯ */
.top-bar {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 6px 12px;
  z-index: 20;
  width: max-content;
  max-width: 96vw;
}

.scene-tabs { display: flex; gap: 4px; background: rgba(0,0,0,0.15); padding: 4px; border-radius: 12px; }
.btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--tx);
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: all 0.15s ease;
}
.btn:hover { background: rgba(255,255,255,0.1); }
.btn.active { background: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 4px 12px rgba(37,99,235,0.3); }

.divider { width: 1px; height: 20px; background: var(--panel-border); margin: 0 2px; flex-shrink: 0; }

/* МЕНЮ ПАНЕЛЕЙ: повторное открытие закрытых окон */
.panel-selector {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  z-index: 30;
  display: none;
  min-width: 220px;
  padding: 6px;
  border-radius: 12px;
}
.panel-selector.open { display: block; }
.panel-selector button {
  display: block;
  width: 100%;
  padding: 9px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--tx);
  text-align: left;
  font: inherit;
  cursor: pointer;
}
.panel-selector button:hover,
.panel-selector button:focus-visible { background: rgba(255,255,255,0.12); outline: none; }
.widget-header { touch-action: none; }
.widget.minimized { min-height: 0; }
.widget.minimized .widget-body { display: none; }

/* ПЛАВАЮЩИЕ ИНТЕРАКТИВНЫЕ ВИДЖЕТЫ */
.widget {
  position: absolute;
  z-index: 15;
  display: flex;
  flex-direction: column;
  min-width: 260px;
  max-width: 460px;
  overflow: hidden;
  opacity: 1;
  transform: scale(1);
  transform-origin: top left;
}

.widget.hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(0.95);
}

.widget-header {
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: move;
  border-bottom: 1px solid var(--panel-border);
  background: rgba(255,255,255,0.03);
}

.widget-title { font-weight: 600; font-size: 14px; color: var(--mu); text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
.widget-controls { display: flex; gap: 4px; }
.icon-btn {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--mu);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  flex-shrink: 0;
}
.icon-btn:hover { background: rgba(255,255,255,0.15); color: var(--tx); }

.widget-body {
  padding: 12px 16px;
  overflow-y: auto;
  max-height: 70vh;
}

/* ОПИСАНИЕ СЦЕНЫ */
#w-desc { top: 75px; left: 20px; width: 380px; }
#w-desc .widget-body { font-size: 16px; line-height: 1.5; }

/* НАСТРОЙКИ СИМУЛЯЦИИ */
#w-params { top: 75px; right: 20px; width: 320px; }
.param-group { display: flex; flex-direction: column; gap: 10px; }
.param-row { display: flex; flex-direction: column; gap: 4px; }
.param-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--mu); }
input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
select {
  width: 100%;
  background: rgba(0,0,0,0.2);
  border: 1px solid var(--panel-border);
  color: var(--tx);
  padding: 6px 10px;
  border-radius: 8px;
  outline: none;
}
.toggles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.toggles-grid label { font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }

/* МЕТРИКИ И ПОКАЗАТЕЛИ */
#w-metrics { top: 460px; right: 20px; width: 320px; }
.metric-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px; }
.metric-row:last-child { border-bottom: none; }
.metric-label { color: var(--mu); }
.metric-value { font-weight: 600; font-variant-numeric: tabular-nums; }

/* ОКНО С ФОРМУЛОЙ (ПЕРЕМЕЩАЕМОЕ И ЗАКРЫВАЕМОЕ) */
#w-formula {
  bottom: 20px;
  left: calc(50% - min(230px, 45vw));
  width: min(460px, 90vw);
  max-width: 90vw;
}
#w-formula .widget-body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 20px;
}
#fm .katex { font-size: 1.2em; color: var(--C); }

/* ШПАРГАЛКА СПИКЕРА */
#w-cheat { bottom: 90px; left: 20px; width: 440px; }
#w-cheat ul { margin: 0; padding-left: 18px; line-height: 1.5; color: var(--tx); }
#w-cheat li { margin-bottom: 6px; }
#w-cheat li:last-child { margin-bottom: 0; }

@media (max-width: 768px) {
  .top-bar { width: 95%; flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; }
  .widget { width: 90vw !important; left: 5vw; right: auto; }
  #w-params, #w-metrics { right: auto; }
  #w-desc { top: 70px; }
  #w-params { top: 220px; }
  #w-metrics { top: auto; bottom: 80px; }
  #w-formula { bottom: 16px; left: 5vw; font-size: 14px; }
}
</style>
</head>
<body>

<!-- ФОНОВЫЙ КАНВАС -->
<canvas id="cv"></canvas>

<!-- ИНТЕРФЕЙСНЫЙ СЛОЙ -->
<div class="ui-layer" id="ui-layer">

  <!-- ВЕРХНЯЯ ПАНЕЛЬ УПРАВЛЕНИЯ -->
  <header class="top-bar glass">
    <button class="btn" id="openMenu" aria-label="Открыть меню панелей" aria-expanded="false" aria-controls="panelSelector">☰ Панели</button>
    <div class="panel-selector glass" id="panelSelector" role="menu" aria-label="Список панелей">
      <button type="button" data-panel="w-desc" role="menuitem">Описание темы</button>
      <button type="button" data-panel="w-params" role="menuitem">Параметры среды</button>
      <button type="button" data-panel="w-metrics" role="menuitem">Данные измерений</button>
      <button type="button" data-panel="w-cheat" role="menuitem">Подробнее</button>
      <button type="button" data-panel="w-formula" role="menuitem">Формула</button>
    </div>
    <div class="scene-tabs" id="tabs"></div>
    <div class="divider"></div>
    <button class="btn" id="pl">⏸ Пауза</button>
    <button class="btn" id="st" title="Шаг T/4">⏭</button>
    <div class="divider"></div>
    <button class="btn icon-btn" id="zoom-out" title="Уменьшить фон">−</button>
    <button class="btn" id="zoom-reset" title="Сбросить масштаб фона (100%)" style="padding: 4px 8px; font-variant-numeric: tabular-nums;">100%</button>
    <button class="btn icon-btn" id="zoom-in" title="Увеличить фон">+</button>
    <div class="divider"></div>
    <button class="btn icon-btn" id="btn-toggle-params" title="Настройки">⚙️</button>
    <button class="btn icon-btn" id="btn-toggle-metrics" title="Метрики">📊</button>
    <button class="btn icon-btn" id="btn-toggle-cheat" title="Шпаргалка">💡</button>
    <button class="btn icon-btn" id="btn-toggle-formula" title="Формула">∑</button>
    <button class="btn icon-btn" id="th" title="Тема">☀/🌙</button>
  </header>

  <!-- ВИДЖЕТ: ОПИСАНИЕ СЦЕНЫ -->
  <div class="widget glass" id="w-desc">
    <div class="widget-header">
      <span class="widget-title">📌 Описание темы</span>
      <div class="widget-controls">
        <button class="icon-btn minimize-btn" type="button" aria-label="Свернуть панель" aria-expanded="true" title="Свернуть">−</button>
        <button class="icon-btn close-btn" type="button" aria-label="Закрыть панель" title="Закрыть">✕</button>
      </div>
    </div>
    <div class="widget-body" id="desc"></div>
  </div>

  <!-- ВИДЖЕТ: УПРАВЛЕНИЕ И ПАРАМЕТРЫ -->
  <div class="widget glass" id="w-params">
    <div class="widget-header">
      <span class="widget-title">⚙️ Параметры среды</span>
      <div class="widget-controls">
        <button class="icon-btn minimize-btn" type="button" aria-label="Свернуть панель" aria-expanded="true" title="Свернуть">−</button>
        <button class="icon-btn close-btn" type="button" aria-label="Закрыть панель" title="Закрыть">✕</button>
      </div>
    </div>
    <div class="widget-body param-group">
      <div class="param-row">
        <div class="param-label"><span>Частота <span id="lbl_nu"></span></span><b id="nuv"></b></div>
        <input type="range" id="nu" min="30" max="300" step="1" value="100">
      </div>
      <div class="param-row">
        <div class="param-label"><span>Среда распространения</span></div>
        <select id="med">
          <option value="vac">Вакуум (n = 1)</option>
          <option value="air">Воздух (n ≈ 1.0003)</option>
          <option value="wat" selected>Вода (n ≈ 1.33)</option>
          <option value="gls">Стекло (n ≈ 1.5)</option>
          <option value="cus">Своя среда…</option>
        </select>
      </div>
      <div class="param-row" id="nnw" style="display:none">
        <div class="param-label"><span>Показатель преломления <span id="lbl_n"></span></span><b id="nnv"></b></div>
        <input type="range" id="nn" min="1" max="3" step="0.01" value="1.8">
      </div>
      <div class="param-row">
        <div class="param-label"><span>Амплитуда / Ускорение</span><b id="ampv"></b></div>
        <input type="range" id="amp" min="0" max="1" step="0.01" value="0.7">
      </div>
      <div class="param-row" id="detw" style="display:none">
        <div class="param-label"><span>Расстройка резонатора <span id="lbl_det"></span></span><b id="detv"></b></div>
        <input type="range" id="det" min="-30" max="30" step="0.5" value="0">
      </div>
      <div class="param-row">
        <div class="param-label"><span>Масштаб фона</span><b id="zoomv">100%</b></div>
        <input type="range" id="zoom-slider" min="35" max="350" step="5" value="100">
      </div>

      <div class="toggles-grid">
        <label><input type="checkbox" id="vec" checked> <span id="lbl_vec"></span></label>
        <label><input type="checkbox" id="ax" checked> Оси, <span id="lbl_lam"></span></label>
        <label><input type="checkbox" id="screw" checked> Правый винт</label>
        <label><input type="checkbox" id="fo" checked> Формула</label>
      </div>
    </div>
  </div>

  <!-- ВИДЖЕТ: МЕТРИКИ -->
  <div class="widget glass" id="w-metrics">
    <div class="widget-header">
      <span class="widget-title">📊 Данные измерений</span>
      <div class="widget-controls">
        <button class="icon-btn minimize-btn" type="button" aria-label="Свернуть панель" aria-expanded="true" title="Свернуть">−</button>
        <button class="icon-btn close-btn" type="button" aria-label="Закрыть панель" title="Закрыть">✕</button>
      </div>
    </div>
    <div class="widget-body" id="met"></div>
  </div>

  <!-- ВИДЖЕТ: ШПАРГАЛКА СПИКЕРА -->
  <div class="widget glass hidden" id="w-cheat">
    <div class="widget-header">
      <span class="widget-title">Подробнее</span>
      <div class="widget-controls">
        <button class="icon-btn minimize-btn" type="button" aria-label="Свернуть панель" aria-expanded="true" title="Свернуть">−</button>
        <button class="icon-btn close-btn" type="button" aria-label="Закрыть панель" title="Закрыть">✕</button>
      </div>
    </div>
    <div class="widget-body">
      <ul id="ck"></ul>
    </div>
  </div>

  <!-- ВИДЖЕТ: ГЛАВНАЯ ФОРМУЛА -->
  <div class="widget glass" id="w-formula">
    <div class="widget-header">
      <span class="widget-title">📐 Формула</span>
      <div class="widget-controls">
        <button class="icon-btn minimize-btn" type="button" aria-label="Свернуть панель" aria-expanded="true" title="Свернуть">−</button>
        <button class="icon-btn close-btn" type="button" aria-label="Закрыть панель" title="Закрыть">✕</button>
      </div>
    </div>
    <div class="widget-body">
      <div id="fm"></div>
    </div>
  </div>

</div>

<script>
const $ = s => document.querySelector(s), cv = $('#cv'), g = cv.getContext('2d'), TAU = Math.PI * 2, c0 = 2.998e8;
const MED = {vac: ['Вакуум', 1], air: ['Воздух', 1.0003], wat: ['Вода', 1.33], gls: ['Стекло', 1.5], cus: ['Своя среда', 1.8]};
const SC = ['Плоская ЭМ-волна', 'Ускоренный заряд', 'Контур → вибратор', 'Опыт Герца'];

const DESC = [
  '§20. Бегущая волна вдоль оси x: $\\vec{E} \\perp \\vec{B} \\perp \\vec{c}$. Справа — среда: $\\nu$ прежняя, $\\lambda$ меньше.',
  '§20. Электромагнитные волны излучает заряд, движущийся с ускорением $\\vec{a}$.',
  '§21. Закрытый $LC$-контур не излучает; открытый вибратор — излучает.',
  '§21. Передатчик $\\rightarrow$ волна $\\rightarrow$ резонатор: при совпадении частот — резонанс и искра.'
];

const CK = [
  [
    'ЭМ волна — распространение колебаний $\\vec{E}$ и $\\vec{B}$ в пространстве; она поперечная: $\\vec{E} \\perp \\vec{B} \\perp \\vec{c}$.',
    'В вакууме $c = \\frac{1}{\\sqrt{\\varepsilon_0 \\mu_0}} \\approx 3 \\cdot 10^8 \\text{ м/с}$; в среде $v = \\frac{c}{n}$.',
    'При входе в среду частота $\\nu$ не меняется, $\\lambda = \\frac{v}{\\nu}$ уменьшается; $\\vec{E}$ и $\\vec{B}$ колеблются синфазно.'
  ],
  [
    'Волну излучают заряды, движущиеся с ускорением $\\vec{a}$; равномерное движение не излучает.',
    'Чем больше ускорение, тем интенсивнее волна $I \\propto a^2$ (при $a \\to 0$ излучения нет).',
    'Излучение максимально перпендикулярно оси колебаний и равно нулю вдоль неё.'
  ],
  [
    'Закрытый контур: $\\vec{E}$ — в конденсаторе, $\\vec{B}$ — в катушке; волна не уходит.',
    'Раздвигаем пластины и уменьшаем катушку: $\\nu = \\frac{1}{2\\pi \\sqrt{LC}}$ растёт, поле выходит в пространство.',
    '$t = 0$: ток и $\\vec{B}$ максимальны, $\\vec{E} = 0$. Через $T/4$: $I = 0$, заряды на концах, $\\vec{E}$ максимально.'
  ],
  [
    'Передатчик: источник высокого напряжения, дроссели, вибратор с искровым промежутком.',
    'Приёмник — такой же вибратор (резонатор): электроны совершают вынужденные колебания.',
    'Частоты совпали — резонанс: амплитуда резко растёт, проскакивает искра. Скорость волны оказалась равна $c$.'
  ]
];

const S = {sc: 0, play: 1, tau: 0, spd: 1, nu: 100, amp: .7, det: 0, med: 'wat', n: 1.8, vec: 1, ax: 1, screw: 1, form: 1, zoom: 1, panX: 0, panY: 0}, C = {};
let W = 0, H = 0, PH = {}, pxm = 0, R = [], FM_TEX = '', last = performance.now();

// РЕНДЕРИНГ MATH-ФОРМУЛ В LATEX
function tex(expr, inline = true) {
  try {
    return katex.renderToString(expr, { displayMode: !inline, throwOnError: false });
  } catch (e) {
    return expr;
  }
}

const fl = m => m >= 1 ? m.toFixed(2) + ' м' : (m * 100).toFixed(1) + ' см';
const fv = v => (v / 1e8).toFixed(3) + ' · 10⁸ м/с';
const sg = x => (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(2);

function theme() {
  const s = getComputedStyle(document.documentElement);
  ['bg', 'tx', 'mu', 'ln', 'E', 'B', 'C', 'ok', 'bad', 'pn'].forEach(k => C[k] = s.getPropertyValue('--' + k).trim());
}

// ГРАФИЧЕСКИЕ ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ КАНВАСА
function L(a, b, c, d, col, w) { g.strokeStyle = col; g.lineWidth = w || 2; g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.stroke(); }
function A(a, b, c, d, col, w) {
  const l = Math.hypot(c - a, d - b); L(a, b, c, d, col, w); if (l < 7) return;
  const t = Math.atan2(d - b, c - a), s = Math.min(11, l * .4);
  g.fillStyle = col; g.beginPath(); g.moveTo(c, d);
  g.lineTo(c - s * Math.cos(t - .4), d - s * Math.sin(t - .4));
  g.lineTo(c - s * Math.cos(t + .4), d - s * Math.sin(t + .4)); g.fill();
}
function T(s, x, y, col, sz, al, vec) {
  sz = sz || 18; g.fillStyle = col; g.font = (vec ? 'italic bold ' : '') + sz + 'px system-ui,sans-serif';
  g.textAlign = al || 'left'; g.fillText(s, x, y);
  if (vec) {
    const m = g.measureText(s).width, l = al == 'center' ? x - m / 2 : al == 'right' ? x - m : x, yy = y - sz * .95;
    g.strokeStyle = col; g.lineWidth = 1.6; g.beginPath(); g.moveTo(l, yy); g.lineTo(l + m, yy);
    g.lineTo(l + m - 4, yy - 3); g.moveTo(l + m, yy); g.lineTo(l + m - 4, yy + 3); g.stroke();
  }
}
function spark(x, y, hg, sc) {

/* СЦЕНА 1: ПЛОСКАЯ ЭМ-ВОЛНА */

/* СЦЕНА 2: УСКОРЕННЫЙ ЗАРЯД */

}

/* СЦЕНА 3: КОНТУР И ВИБРАТОР */
function sc3(w, h, ph) {
  const cy = h * .5, I = Math.cos(TAU * S.tau), q = Math.sin(TAU * S.tau), xl = w * .1, xr = w * .34, xm = (xl + xr) / 2;
  L(xl, cy - 72, xr, cy - 72, C.tx, 3); L(xr, cy - 72, xr, cy - 16, C.tx, 3);

}

/* СЦЕНА 4: ОПЫТ ГЕРЦА */

}

  ];

  $('#met').innerHTML = rows.map(r => `<div class="metric-row"><span class="metric-label">${tex(r[0])}</span><b class="metric-value"${r[2] ? ` style="color:${r[2]}"` : ''}>${r[1]}</b></div>`).join('');
  $('#fm').innerHTML = tex(FM_TEX, false);
}

function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  if (S.play) S.tau += dt * .35 * S.spd;
  draw();
  requestAnimationFrame(frame);
}

function rs() {
  W = window.innerWidth;
  H = window.innerHeight;
  const d = devicePixelRatio || 1;
  cv.width = W * d; cv.height = H * d;
  g.setTransform(d, 0, 0, d, 0, 0);
}

function go(i) {
  S.sc = i;
  [...$('#tabs').children].forEach((b, j) => b.classList.toggle('active', j == i));

  $('#desc').innerHTML = DESC[i].replace(/\$(.*?)\$/g, (_, m) => tex(m));
  $('#ck').innerHTML = CK[i].map(t => '<li>' + t.replace(/\$(.*?)\$/g, (_, m) => tex(m)) + '</li>').join('');

  $('#detw').style.display = i == 3 ? '' : 'none';
}

function upd() {
  S.nu = +$('#nu').value; S.amp = +$('#amp').value; S.det = +$('#det').value; S.med = $('#med').value; S.n = +$('#nn').value;
  $('#nuv').textContent = S.nu + ' МГц';
  $('#ampv').textContent = Math.round(S.amp * 100) + ' %';
  $('#detv').innerHTML = tex('\\delta = ' + (S.det > 0 ? '+' : '') + S.det + '\\%');
  $('#nnv').textContent = S.n.toFixed(2);
  $('#nnw').style.display = S.med == 'cus' ? '' : 'none';

  S.vec = $('#vec').checked; S.ax = $('#ax').checked; S.screw = $('#screw').checked; S.form = $('#fo').checked;
  const wf = $('#w-formula');
  if (S.form) {
    if (wf.classList.contains('hidden')) restorePanel('w-formula');
  } else {
    wf.classList.add('hidden');
  }
}

// МАСШТАБИРОВАНИЕ И ПЕРЕМЕЩЕНИЕ ФОНОВОГО КАНВАСА
function updateZoomUI() {
  const pct = Math.round(S.zoom * 100);
  $('#zoom-reset').textContent = pct + '%';
  $('#zoomv').textContent = pct + '%';
  $('#zoom-slider').value = pct;
}

function setZoom(nextZoom, anchorX = W / 2, anchorY = H / 2) {
  const clamped = Math.max(0.35, Math.min(3.5, Math.round(nextZoom * 100) / 100));
  if (clamped === S.zoom) return;
  const ratio = clamped / S.zoom;
  S.panX = anchorX - W / 2 - ratio * (anchorX - W / 2 - S.panX);
  S.panY = anchorY - H / 2 - ratio * (anchorY - H / 2 - S.panY);
  S.zoom = clamped;
  updateZoomUI();
}

function resetView() {
  S.zoom = 1;
  S.panX = 0;
  S.panY = 0;
  updateZoomUI();
}

$('#zoom-in').onclick = () => setZoom(S.zoom * 1.15);
$('#zoom-out').onclick = () => setZoom(S.zoom / 1.15);
$('#zoom-reset').onclick = resetView;
$('#zoom-slider').addEventListener('input', e => setZoom(+e.target.value / 100));

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  setZoom(S.zoom * factor, e.clientX - rect.left, e.clientY - rect.top);
}, { passive: false });

let cvDrag = null;
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  cvDrag = { pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, panX: S.panX, panY: S.panY };
  cv.setPointerCapture?.(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!cvDrag || e.pointerId !== cvDrag.pointerId) return;
  S.panX = cvDrag.panX + (e.clientX - cvDrag.startX);
  S.panY = cvDrag.panY + (e.clientY - cvDrag.startY);
});
const stopCvDrag = e => {
  if (cvDrag && (!e || e.pointerId === cvDrag.pointerId)) cvDrag = null;
};
cv.addEventListener('pointerup', stopCvDrag);
cv.addEventListener('pointercancel', stopCvDrag);
cv.addEventListener('lostpointercapture', stopCvDrag);
cv.addEventListener('dblclick', resetView);

// ИНИЦИАЛИЗАЦИЯ И УПРАВЛЕНИЕ ТАБИКАМИ И ПАРАМЕТРАМИ
SC.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'btn';
  b.textContent = (i + 1) + ' · ' + s;
  b.onclick = () => go(i);
  $('#tabs').append(b);
});

const pl = () => { $('#pl').textContent = S.play ? '⏸ Пауза' : '▶ Старт'; };
const step = () => { S.tau = (Math.floor(S.tau * 4 + 1e-6) + 1) / 4; S.play = 0; pl(); };
const tgl = () => { S.play = !S.play; pl(); };

$('#pl').onclick = tgl;
$('#st').onclick = step;
$('#th').onclick = () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme == 'light' ? 'dark' : 'light';
  theme();
};

document.querySelectorAll('aside input, aside select, .toggles-grid input, select, input[type=range]').forEach(e => {
  if (e.id !== 'zoom-slider') e.oninput = e.onchange = upd;
});

// УПРАВЛЕНИЕ ПАНЕЛЯМИ: перетаскивание мышью/касанием, клавиатура, сворачивание и закрытие
const widgets = [...document.querySelectorAll('.widget')];

function setPanelPosition(widget, left, top) {
  const maxLeft = Math.max(8, window.innerWidth - widget.offsetWidth - 8);
  const maxTop = Math.max(8, window.innerHeight - widget.offsetHeight - 8);
  widget.style.right = 'auto';
  widget.style.bottom = 'auto';
  widget.style.left = Math.max(8, Math.min(maxLeft, left)) + 'px';
  widget.style.top = Math.max(8, Math.min(maxTop, top)) + 'px';
}

function restorePanel(id) {
  const widget = document.getElementById(id);
  if (!widget) return;
  widget.classList.remove('hidden', 'minimized');
  const body = widget.querySelector('.widget-body');
  if (body) body.style.display = '';
  const minimize = widget.querySelector('.minimize-btn');
  if (minimize) {
    minimize.setAttribute('aria-expanded', 'true');
    minimize.title = 'Свернуть';
    minimize.setAttribute('aria-label', 'Свернуть панель');
  }
  if (id === 'w-formula') {
    S.form = true;
    $('#fo').checked = true;
  }
}

widgets.forEach(widget => {
  const header = widget.querySelector('.widget-header');
  if (!header) return;
  header.tabIndex = 0;
  header.setAttribute('role', 'group');
  header.setAttribute('aria-label', 'Заголовок панели; перетащите для перемещения');

  let drag = null;
  header.addEventListener('pointerdown', e => {
    if (e.target.closest('.widget-controls')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const rect = widget.getBoundingClientRect();
    drag = { pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, left: rect.left, top: rect.top };
    setPanelPosition(widget, rect.left, rect.top);
    header.setPointerCapture?.(e.pointerId);
    e.preventDefault();
  });

  header.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pointerId) return;
    setPanelPosition(widget, drag.left + e.clientX - drag.startX, drag.top + e.clientY - drag.startY);
  });

  const stopDrag = e => {
    if (drag && (!e || e.pointerId === drag.pointerId)) drag = null;
  };
  header.addEventListener('pointerup', stopDrag);
  header.addEventListener('pointercancel', stopDrag);
  header.addEventListener('lostpointercapture', stopDrag);

  // Перемещение выбранной панели стрелками клавиатуры.
  header.addEventListener('keydown', e => {
    const delta = e.shiftKey ? 30 : 10;
    const moves = {
      ArrowUp: [0, -delta], ArrowDown: [0, delta],
      ArrowLeft: [-delta, 0], ArrowRight: [delta, 0]
    };
    if (!moves[e.key] || e.target.closest('button')) return;
    e.preventDefault();
    const rect = widget.getBoundingClientRect();
    setPanelPosition(widget, rect.left + moves[e.key][0], rect.top + moves[e.key][1]);
  });

  const closeBtn = widget.querySelector('.close-btn');
  if (closeBtn) closeBtn.addEventListener('click', () => {
    widget.classList.add('hidden');
    if (widget.id === 'w-formula') {
      S.form = false;
      $('#fo').checked = false;
    }
  });

  const minimizeBtn = widget.querySelector('.minimize-btn');
  if (minimizeBtn) minimizeBtn.addEventListener('click', () => {
    const isMinimized = widget.classList.toggle('minimized');
    minimizeBtn.setAttribute('aria-expanded', String(!isMinimized));
    minimizeBtn.title = isMinimized ? 'Развернуть' : 'Свернуть';
    minimizeBtn.setAttribute('aria-label', isMinimized ? 'Развернуть панель' : 'Свернуть панель');
  });
});

// Меню показывает любую из пяти панелей, даже если она была закрыта.
const openMenu = $('#openMenu');
const panelSelector = $('#panelSelector');
openMenu.addEventListener('click', () => {
  const isOpen = panelSelector.classList.toggle('open');
  openMenu.setAttribute('aria-expanded', String(isOpen));
});

panelSelector.querySelectorAll('[data-panel]').forEach(button => {
  button.addEventListener('click', () => {
    restorePanel(button.dataset.panel);
    panelSelector.classList.remove('open');
    openMenu.setAttribute('aria-expanded', 'false');
  });
});

document.addEventListener('pointerdown', e => {
  if (!panelSelector.contains(e.target) && e.target !== openMenu) {
    panelSelector.classList.remove('open');
    openMenu.setAttribute('aria-expanded', 'false');
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    panelSelector.classList.remove('open');
    openMenu.setAttribute('aria-expanded', 'false');
  }
});

// Кнопки верхней панели работают как быстрые переключатели окон.
const setupToggle = (btnId, widgetId) => {
  $(btnId).onclick = () => {
    const widget = $(widgetId);
    if (widget.classList.contains('hidden') || widget.classList.contains('minimized')) {
      restorePanel(widgetId.slice(1));
    } else {
      widget.classList.add('hidden');
      if (widgetId === '#w-formula') {
        S.form = false;
        $('#fo').checked = false;
      }
    }
  };
};
setupToggle('#btn-toggle-params', '#w-params');
setupToggle('#btn-toggle-metrics', '#w-metrics');
setupToggle('#btn-toggle-cheat', '#w-cheat');
setupToggle('#btn-toggle-formula', '#w-formula');

window.onresize = () => {
  rs();
  widgets.forEach(widget => {
    if (widget.classList.contains('hidden')) return;
    const rect = widget.getBoundingClientRect();
    setPanelPosition(widget, rect.left, rect.top);
  });
};

window.onload = () => {
  renderMathLabels();
  theme();
  rs();
  upd();
  updateZoomUI();
  go(0);
  pl();
  requestAnimationFrame(frame);
};
</script>
</body>
</html>
